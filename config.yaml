# ==============================================================================
# AI-Generated Image Detector Configuration
# ==============================================================================

# Directory and file paths
paths:
  train_dir: "database/train"
  valid_dir: "database/valid"
  test_dir: "database/test"
  model_save_dir: "models"
  best_model_path: "models/best_model.pth"
  history_save_path: "models/training_history.json"
  confusion_matrix_path: "models/confusion_matrix.png"

# Dataset and DataLoader settings
dataset:
  classes:
    - "real"
    - "fake"
  class_to_idx:
    real: 0
    fake: 1
  image_size: 224
  batch_size: 32
  num_workers: 0             # 0 recommended for Windows / CPU training
  val_split_ratio: 0.15      # Auto-split 15% from train if valid/ directory is empty

# Training-time data augmentation (applied to train set only)
augmentation:
  random_horizontal_flip_prob: 0.5
  random_rotation_degrees: 15
  color_jitter:
    brightness: 0.1
    contrast: 0.1
    saturation: 0.1
    hue: 0.05

# Model architecture settings
model:
  backbone: "resnet50"       # Options: resnet18, resnet34, resnet50, efficientnet_b0, efficientnet_b2
  pretrained: true           # True = transfer learning with ImageNet weights, False = train from scratch
  num_classes: 2             # Binary classification: Real (0) vs AI-Generated (1)
  dropout_rate: 0.3          # Dropout probability in classifier head

# Training hyperparameters & optimization
training:
  num_epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"          # Options: adam, adamw, sgd
  scheduler: "cosine"        # Options: cosine, steplr, none
  step_size: 7               # Used if scheduler is 'steplr'
  gamma: 0.1                 # Multiplicative factor of learning rate decay
  seed: 42
  device: "auto"             # Options: auto, cuda, cpu
